# Supabase gratis pausa el proyecto tras 7 días sin actividad. Una consulta
# cada 3 días lo mantiene despierto aunque nadie use la app.
name: Mantener Supabase despierto

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase respondió"
